
<!DOCTYPE html>
<html>
<head>
    <title>DAS - Digital Address Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        h1 { color: #333; }
        #addressBox { margin-top: 20px; padding: 10px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #map { height: 300px; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>DAS - Digital Address System</h1>
    <button onclick="generateAddress()">Generate Digital Address</button>
    <div id="addressBox">
        <p><strong>Digital Address:</strong> <span id="address">None</span></p>
    </div>
    <div id="map"></div>
    <script>
        function generateAddress() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    const address = `DAS-${lat}-${lon}`;
                    document.getElementById('address').innerText = address;
                    const mapUrl = `https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
                    document.getElementById('map').innerHTML = `<iframe width="100%" height="300" src="${mapUrl}"></iframe>`;
                }, () => {
                    alert("Location access denied.");
                });
            } else {
                alert("Geolocation not supported.");
            }
        }
    </script>
</body>
</html>
